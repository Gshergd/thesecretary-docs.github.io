name: Publish documentation
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [secretary-docs-updated]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical documentation (never committed here)
        uses: actions/checkout@v4
        with:
          repository: Gshergd/The-Secretary
          ref: main
          path: .source/secretary
          token: ${{ secrets.SECRETARY_SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            Documentation
            secretary-commands.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --source-root .source/secretary
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
